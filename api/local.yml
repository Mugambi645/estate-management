services:
  api: &api
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: estate_prod_api
    container_name: estate_prod_api
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app:z
      - ./staticfiles:/app/staticfiles
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    env_file:
      - ./.envs/.env.local
    depends_on:
      - postgres
      - mailpit
    command: /start
    networks:
      - estate_prod_nw

  postgres:
    build:
      context: .
      dockerfile: ./docker/local/postgres/Dockerfile
    image: estate_prod_postgres
    container_name: estate_prod_postgres
    ports:
      - "5432:5432"
    volumes:
      - estate_prod_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.envs/.env.local
    networks:
      - estate_prod_nw

  mailpit:
    image: docker.io/axllent/mailpit:v1.15
    container_name: estate_prod_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - estate_prod_mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - estate_prod_nw

  client:
    build:
      context: ./client
      dockerfile: ./docker/local/Dockerfile
    image: estate_client
    container_name: estate_client
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    environment:
      # File-watching / HMR on bind mounts (needed on macOS/Windows hosts)
      WATCHPACK_POLLING: "true"
    volumes:
      - ./client:/app
      # Named (not anonymous) so it can be removed explicitly when deps change:
      #   make client-reset-deps
      - client_node_modules:/app/node_modules
      - client_next_cache:/app/.next
    networks:
      - estate_prod_nw

  nginx:
    build:
      context: ./docker/local/nginx
      dockerfile: Dockerfile
    restart: always
    container_name: estate_nginx
    ports:
      - "8080:80"
    volumes:
      - ./staticfiles:/app/staticfiles
      - logs_store:/var/log/nginx
    depends_on:
      - api
      - client
    networks:
      - estate_prod_nw

networks:
  estate_prod_nw:
    external: true

volumes:
  estate_prod_postgres_data: {}
  estate_prod_mailpit_data: {}
  client_node_modules: {}
  client_next_cache: {}
  logs_store: {}